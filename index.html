<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181D" media="(prefers-color-scheme: dark)">
  <script>
    // Thème choisi sur cet appareil (voir src/ui/theme.js), appliqué avant l'affichage pour éviter un flash.
    try {
      var t = localStorage.getItem("carnet.theme");
      if (t === "light" || t === "dark") {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === "dark" ? "#17181D" : "#FAF6EE"; });
      }
    } catch (e) {}
  </script>
  <title>Carnet de langue partagé</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500;1,9..144,600&family=Figtree:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <div id="app" class="wrap"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
